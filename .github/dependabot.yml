version: 2

# Generated by allclear. Security updates only. Version updates are disabled (open-pull-requests-limit: 0), which GitHub does not apply to security updates.
#
# Ecosystems listed below are the ones this repository actually contains;
# deliberately-vulnerable fixture trees are excluded so the scanner does not
# raise pull requests against test data.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Written explicitly on EVERY ecosystem. Leaving this key out does not mean
    # zero, it means the default of 5 — which is how a config that looks
    # security-only keeps opening version-update pull requests.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Written explicitly on EVERY ecosystem. Leaving this key out does not mean
    # zero, it means the default of 5 — which is how a config that looks
    # security-only keeps opening version-update pull requests.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
