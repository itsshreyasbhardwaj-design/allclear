[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allclear"
version = "0.1.0"
description = "Account-wide GitHub exposure audit that tells you which findings are real."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shreyas Bhardwaj" }]
keywords = ["security", "github", "secrets", "gitleaks", "dependabot", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# Deliberately empty. The whole tool is standard library plus the `gh` CLI,
# which already holds the user's credentials. A security tool that needs you to
# install a dependency tree is one more supply chain to trust.
dependencies = []

[project.scripts]
allclear = "allclear.cli:main"

[project.urls]
Homepage = "https://github.com/itsshreyasbhardwaj-design/allclear"
Issues = "https://github.com/itsshreyasbhardwaj-design/allclear/issues"

[tool.setuptools.packages.find]
where = ["src"]
